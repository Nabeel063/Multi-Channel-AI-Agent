<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Haven Real Estates - Chat</title>
<style>
  :root { --bg:#ffffff; --fg:#1c2b33; --muted:#6b7b84; --card:#f2f6f7; --brand:#1f4e5f; --me:#1f4e5f; --me-fg:#fff; --line:#d8e1e4; }
  @media (prefers-color-scheme: dark) { :root { --bg:#14201f; --fg:#e8f0f1; --muted:#93a5ab; --card:#1e2e2f; --brand:#4fa3b8; --me:#2f7f95; --me-fg:#fff; --line:#2c4143; } }
  * { box-sizing: border-box; }
  body { margin:0; font-family: Arial, sans-serif; background:var(--bg); color:var(--fg); display:flex; justify-content:center; }
  .app { width:100%; max-width:480px; height:100vh; display:flex; flex-direction:column; }
  header { padding:14px 16px; background:var(--brand); color:#fff; font-weight:bold; }
  .id { display:flex; gap:6px; padding:8px; border-bottom:1px solid var(--line); }
  .id input { flex:1; min-width:0; padding:7px; border:1px solid var(--line); border-radius:6px; background:var(--card); color:var(--fg); font-size:13px; }
  #log { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:8px; }
  .m { max-width:85%; padding:9px 12px; border-radius:12px; white-space:pre-wrap; line-height:1.4; font-size:14px; }
  .bot { background:var(--card); align-self:flex-start; }
  .me { background:var(--me); color:var(--me-fg); align-self:flex-end; }
  .m img { display:block; width:100%; border-radius:8px; margin-top:8px; }
  form { display:flex; gap:8px; padding:10px; border-top:1px solid var(--line); }
  form input { flex:1; padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--card); color:var(--fg); font-size:14px; }
  form button { padding:10px 16px; border:0; border-radius:8px; background:var(--brand); color:#fff; font-weight:bold; cursor:pointer; }
  .hint { color:var(--muted); font-size:12px; padding:0 12px 6px; }
</style>
</head>
<body>
<div class="app">
  <header>Haven Real Estates</header>
  <div class="id">
    <input id="name" placeholder="Your name (optional)">
    <input id="email" placeholder="Email (optional)">
  </div>
  <div id="log"></div>
  <div class="hint">Add your email so we can continue this conversation on any channel.</div>
  <form id="f"><input id="msg" placeholder="Type your message..." autocomplete="off"><button>Send</button></form>
</div>
<script>
  // Paste your n8n webhook URL here (use /webhook-test/... while testing, /webhook/... once the workflow is active)
  const WEBHOOK_URL = 'http://localhost:5678/webhook-test/haven-website-chat';

  let sid = null;
  try { sid = localStorage.getItem('haven_sid'); } catch (e) {}
  if (!sid) { sid = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now())); try { localStorage.setItem('haven_sid', sid); } catch (e) {} }

  const log = document.getElementById('log');
  function bubble(text, who, images) {
    const d = document.createElement('div');
    d.className = 'm ' + who;
    d.textContent = text;
    (images || []).forEach(u => { const i = document.createElement('img'); i.src = u; i.alt = 'Property photo'; d.appendChild(i); });
    log.appendChild(d); log.scrollTop = log.scrollHeight;
    return d;
  }
  bubble('Hi! I am the Haven Real Estates assistant. Are you looking to buy, rent or sell?', 'bot');

  document.getElementById('f').addEventListener('submit', async (e) => {
    e.preventDefault();
    const box = document.getElementById('msg');
    const text = box.value.trim();
    if (!text) return;
    box.value = '';
    bubble(text, 'me');
    const wait = bubble('...', 'bot');
    try {
      const res = await fetch(WEBHOOK_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          channel: 'website', session_id: sid, message: text,
          name: document.getElementById('name').value.trim(),
          email: document.getElementById('email').value.trim()
        })
      });
      const data = await res.json();
      wait.remove();
      bubble(data.reply || 'Sorry, something went wrong.', 'bot', data.images);
    } catch (err) {
      wait.remove();
      bubble('Sorry, I could not reach the server. Please try again.', 'bot');
    }
  });
</script>
</body>
</html>
