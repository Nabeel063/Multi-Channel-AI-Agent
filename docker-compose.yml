services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:latest
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_HOST=0.0.0.0
      - N8N_PORT=5678
      - N8N_PROTOCOL=${PROTOCOL:-http}
      - WEBHOOK_URL=${WEBHOOK_URL:-http://${DOMAIN_NAME:-localhost}:5678/}
      - GENERIC_TIMEZONE=${TIMEZONE:-UTC}
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - N8N_SECURE_COOKIE=false
    volumes:
      - n8n_data:/home/node/.n8n
    networks:
      - haven-net

  discord-relay:
    build: ./channels
    restart: unless-stopped
    environment:
      - DISCORD_BOT_TOKEN=${DISCORD_BOT_TOKEN:-}
      - N8N_WEBHOOK_URL=http://n8n:5678/webhook/haven-discord
    depends_on:
      - n8n
    networks:
      - haven-net

volumes:
  n8n_data:

networks:
  haven-net:
    driver: bridge
